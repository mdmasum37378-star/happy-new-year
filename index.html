<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Happy New Year</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
  overflow:hidden;
}
.container{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:2;
  position:relative;
}
h1{font-size:46px;}
#year{font-size:42px;font-weight:bold;}

.bird{
  position:absolute;
  font-size:30px;
  top:40%;
  left:-50px;
  animation:fly 4s linear forwards;
  z-index:3;
}
@keyframes fly{
  to{left:110%;}
}

.msg{margin-top:25px;font-size:18px;}
.name{margin-top:10px;font-size:16px;}

canvas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:1;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container">
  <h1>🎉 Happy New Year 🎉</h1>
  <div id="year">2025</div>

  <div class="msg">
    নতুন বছর আপনার জীবনে সুখ, শান্তি ও সাফল্য বয়ে আনুক
  </div>

  <div class="name">
    — Md Masum
  </div>
</div>

<script>
// birds
setTimeout(()=>{
  for(let i=0;i<5;i++){
    let b=document.createElement("div");
    b.className="bird";
    b.innerHTML="🐦";
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),4000);
  }
},1000);

setTimeout(()=>{
  document.getElementById("year").innerText="2026";
},4000);

setTimeout(()=>{
  let b=document.createElement("div");
  b.className="bird";
  b.innerHTML="🐦";
  document.body.appendChild(b);
},4200);

// FIREWORKS
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

function random(min,max){return Math.random()*(max-min)+min;}

let particles=[];
function blast(){
  let x=random(100,canvas.width-100);
  let y=random(50,canvas.height/2);
  for(let i=0;i<80;i++){
    particles.push({
      x,y,
      r:random(2,4),
      dx:random(-5,5),
      dy:random(-5,5),
      life:100,
      color:`hsl(${random(0,360)},100%,60%)`
    });
  }
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach((p,i)=>{
    p.x+=p.dx;
    p.y+=p.dy;
    p.life--;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    if(p.life<=0)particles.splice(i,1);
  });
  requestAnimationFrame(animate);
}

setTimeout(()=>{
  setInterval(blast,700);
  animate();
},5500);
</script>

</body>
</html>
