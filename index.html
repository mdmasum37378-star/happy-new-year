<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Happy New Year</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
  overflow:hidden;
  position:relative;
  border:10px solid #ffdd00; /* decorative border */
  box-sizing:border-box;
}

.container{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
  z-index:3;
}

/* 🎉 Happy New Year Moving & Bigger */
@keyframes floatZoom {
  0% { transform: translateY(0) scale(1); }
  25% { transform: translateY(-10px) scale(1.1); }
  50% { transform: translateY(0) scale(1.2); }
  75% { transform: translateY(10px) scale(1.1); }
  100% { transform: translateY(0) scale(1); }
}

h1{
  font-size:70px; /* বড়ো করা */
  animation: floatZoom 3s ease-in-out infinite;
  margin:10px 0;
}

#year{
  font-size:44px;
  font-weight:bold;
  transition: all 1s ease-in-out;
}

.msg{margin-top:25px;font-size:18px;}
.name{margin-top:10px;font-size:16px;}

/* Bird */
.bird{
  position:absolute;
  width:80px;
  top:45%;
  left:-120px;
  transition:all 2.2s ease;
  z-index:5;
}
.bird.back{
  transform:scaleX(-1);
}

/* Fireworks canvas */
canvas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:1;
}

/* Share buttons */
.share-buttons{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:20px;
  flex-wrap:wrap;
}
.share-buttons a{
  background:#ffdd00;
  color:#000;
  padding:12px 20px;
  border-radius:25px;
  text-decoration:none;
  font-weight:bold;
  transition:0.3s;
}
.share-buttons a:hover{
  background:#fff;
  color:#dd2476;
}
</style>
</head>

<body>

<!-- Background Music -->
<audio id="bgSong" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" autoplay loop></audio>

<canvas id="fireworks"></canvas>

<div class="container">
  <h1>🎉 Happy New Year 🎉</h1>

  <div id="year">2025</div>

  <div class="msg" id="wish">
    নতুন বছর আপনার জীবনে সুখ, শান্তি ও সাফল্য বয়ে আনুক
  </div>

  <div class="name" id="from">
    — Md Masum
  </div>

  <!-- Share Buttons -->
  <div class="share-buttons">
    <a href="#" onclick="customShare('whatsapp')">WhatsApp</a>
    <a href="#" onclick="customShare('telegram')">Telegram</a>
    <a href="#" onclick="customShare('copy')">Copy Link</a>
  </div>
</div>

<script>
// ===== BIRD ANIMATION =====
const yearEl = document.getElementById("year");

// Bird takes 5
setTimeout(()=>{
  const bird1=document.createElement("img");
  bird1.src="https://i.imgur.com/7QFQK0F.png";
  bird1.className="bird";
  document.body.appendChild(bird1);
  setTimeout(()=>{ bird1.style.left="45%"; },100);
  setTimeout(()=>{
    yearEl.style.opacity = 0;
    yearEl.style.transform = "scale(0.5)";
  },2400);
  setTimeout(()=>{
    yearEl.innerText="2026";
    yearEl.style.opacity = 1;
    yearEl.style.transform = "scale(1.5)";
    setTimeout(()=>{ yearEl.style.transform = "scale(1)"; },800);
  },3400);
  setTimeout(()=>{ bird1.style.left="110%"; },4200);
  setTimeout(()=>bird1.remove(),5500);
},1000);

// Bird brings 6
setTimeout(()=>{
  const bird2=document.createElement("img");
  bird2.src="https://i.imgur.com/7QFQK0F.png";
  bird2.className="bird back";
  bird2.style.left="110%";
  document.body.appendChild(bird2);
  setTimeout(()=>{ bird2.style.left="45%"; },100);
  setTimeout(()=>{ bird2.style.left="-150px"; },2700);
  setTimeout(()=>bird2.remove(),4500);
},4800);

// ===== REAL FIREWORKS =====
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

function rand(min,max){return Math.random()*(max-min)+min;}
let particles=[];

function blast(){
  let x=rand(100,canvas.width-100);
  let y=rand(50,canvas.height/2);
  for(let i=0;i<90;i++){
    particles.push({
      x,y,
      dx:rand(-6,6),
      dy:rand(-6,6),
      life:100,
      r:rand(2,4),
      color:`hsl(${rand(0,360)},100%,60%)`
    });
  }
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach((p,i)=>{
    p.x+=p.dx;
    p.y+=p.dy;
    p.life--;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    if(p.life<=0) particles.splice(i,1);
  });
  requestAnimationFrame(animate);
}

setTimeout(()=>{
  setInterval(blast,700);
  animate();
},7500);

// ===== CUSTOM SHARE FUNCTION =====
function customShare(platform){
  const name = prompt("আপনার নাম লিখুন:", "Md Masum");
  const message = prompt("আপনার বার্তা লিখুন:", "শুভ নববর্ষ 2026!");
  if(!name || !message) return;

  document.getElementById("from").innerText = `— ${name}`;
  document.getElementById("wish").innerText = message;

  const text = `🎉 Happy New Year 2026! 🎉\n${message}\n— ${name}\n\nLink: ${window.location.href}`;

  if(platform==='whatsapp'){
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank');
  }else if(platform==='telegram'){
    window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(text)}`,'_blank');
  }else if(platform==='copy'){
    navigator.clipboard.writeText(text).then(()=>{
      alert("Link and message copied to clipboard!");
    });
  }
}
</script>

</body>
</html>
