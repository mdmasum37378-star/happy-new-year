<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Happy New Year</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  text-align:center;
  font-family:Arial, sans-serif;
  overflow:hidden;
}
.container{
  position:relative;
  top:50%;
  transform:translateY(-50%);
}
h1{
  font-size:46px;
  margin:10px 0;
}
#year{
  font-size:42px;
  font-weight:bold;
}
.bird{
  position:absolute;
  font-size:30px;
  top:40%;
  left:-50px;
  animation:fly 4s linear forwards;
}
@keyframes fly{
  to{left:110%;}
}
#blast{
  display:none;
  font-size:60px;
  animation:boom 0.6s infinite alternate;
}
@keyframes boom{
  from{transform:scale(1);}
  to{transform:scale(1.4);}
}
.msg{
  margin-top:25px;
  font-size:18px;
}
.name{
  margin-top:10px;
  font-size:16px;
}
.share{
  margin-top:20px;
}
.share a{
  color:#000;
  background:#fff;
  padding:10px 18px;
  border-radius:20px;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="container">
  <h1>🎉 Happy New Year 🎉</h1>
  <div id="year">2025</div>
  <div id="blast">💥🎆✨</div>

  <!-- ✍️ শুভেচ্ছা বার্তা এখানে বদলাবেন -->
  <div class="msg">
    নতুন বছর আপনার জীবনে সুখ, শান্তি ও সাফল্য বয়ে আনুক
  </div>

  <!-- ✍️ নাম এখানে বদলাবেন -->
  <div class="name">
    — Md Masum
  </div>

  <div class="share">
    <a href="https://wa.me/?text=🎉 Happy New Year! শুভ নববর্ষ 🎉">
      📤 Share on WhatsApp
    </a>
  </div>
</div>

<script>
// 5 birds remove 5
setTimeout(()=>{
  for(let i=0;i<5;i++){
    let b=document.createElement("div");
    b.className="bird";
    b.innerHTML="🐦";
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),4000);
  }
},1000);

// change year
setTimeout(()=>{
  document.getElementById("year").innerText="2026";
},4000);

// 1 bird bring 6
setTimeout(()=>{
  let b=document.createElement("div");
  b.className="bird";
  b.innerHTML="🐦";
  document.body.appendChild(b);
},4200);

// blast
setTimeout(()=>{
  document.getElementById("blast").style.display="block";
},5500);
</script>
</body>
</html>
